name: Release
# Cuts a GitHub release from a tag. The build steps are deliberately identical to build.yml, so
# that what is published is what continuous integration already proves on every push.
on:
  push:
    tags:
      # Both conventions are accepted because the mod version itself carries no prefix while
      # release tags conventionally do.
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

jobs:
  release:
    name: Release Minecraft
    runs-on: ubuntu-latest
    permissions:
      # Needed to create the release; the default token is read-only for contents.
      contents: write
      packages: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@main
      - name: Setup JDK 25
        uses: actions/setup-java@main
        with:
          java-version: 25
          distribution: 'temurin'
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Setup website files
        run: ./gradlew setupWebsiteFiles --no-daemon
      - name: Setup Node
        uses: actions/setup-node@main
        with:
          node-version: 24
      - name: Install Node packages
        run: npm ci --prefix website
      - name: Build Angular
        run: npm run build --prefix website
      - name: Setup files
        run: ./gradlew setupFiles -PcrowdinApiKey="${{ secrets.CROWDIN_API_KEY }}" -PpatreonApiKey="${{ secrets.PATREON_API_KEY }}" --no-daemon
      - name: Build
        run: ./gradlew buildAndCollect -x test --no-daemon
      - name: Capture release artifacts
        uses: actions/upload-artifact@main
        with:
          name: Minecraft Transit Railway
          path: build/release/
      - name: Publish release
        # Skipped for a manual run, which has no tag to attach a release to and is only useful for
        # producing the artifacts above.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Every tag that names a pre-release stays marked as one, so that a beta is never
          # presented as the latest stable download.
          case "$TAG" in
            *alpha*|*beta*|*rc*|*pre*) prerelease="--prerelease" ;;
            *) prerelease="" ;;
          esac
          # Generated notes run back to the previous release. There isn't one for the first
          # release, and the fallback is the whole repository history, which on a fork of a
          # long-lived project is thousands of unrelated commits. So generate them only once
          # there is an earlier release to measure against.
          if [ -n "$(gh release list --limit 1)" ]; then
            gh release create "$TAG" build/release/*.jar --title "$TAG" --generate-notes $prerelease
          else
            gh release create "$TAG" build/release/*.jar --title "$TAG" $prerelease --notes "Built from \`$TAG\`. See the readme for the subset of the mod confirmed to work on Minecraft 26.1.2, and the gaps behind it."
          fi
